<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>黑翼</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{position:fixed;inset:0;overflow:hidden;background:#000;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8e2d4;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#look{position:fixed;inset:0;z-index:1}
.ui{position:fixed;z-index:5}
.hide{display:none!important}
/* 顶部信息 */
#topL{left:calc(env(safe-area-inset-left) + 12px);top:8px;font-size:13px;line-height:1.35;text-shadow:0 1px 3px #000;pointer-events:none}
#topL b{color:#ffd27a;font-size:16px}
#safe{left:50%;top:8px;transform:translateX(-50%);padding:3px 12px;border-radius:12px;background:rgba(20,40,30,.55);border:1px solid rgba(120,255,180,.45);color:#9fffc8;font-size:13px;pointer-events:none;white-space:nowrap}
#safe.warn{background:rgba(60,30,10,.55);border-color:rgba(255,170,80,.5);color:#ffc27a}
#msg{left:50%;top:38px;transform:translateX(-50%);font-size:18px;font-weight:700;color:#ffd27a;text-shadow:0 0 8px #000;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#pauseBtn{right:calc(env(safe-area-inset-right) + 12px);top:8px;width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
/* 准星 */
#cross{left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;pointer-events:none}
#cross i{position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px #000}
#cross .t{left:31px;top:4px;width:2px;height:14px}#cross .b{left:31px;bottom:4px;width:2px;height:14px}
#cross .l{top:31px;left:4px;height:2px;width:14px}#cross .r{top:31px;right:4px;height:2px;width:14px}
#cross .c{left:30px;top:30px;width:4px;height:4px;border-radius:2px}
#cross .ring{left:12px;top:12px;width:40px;height:40px;border:1.5px solid rgba(255,255,255,.35);border-radius:50%;background:none;box-shadow:none}
#cross.lock i{background:#ffc040}#cross.lock .ring{border-color:#ffc040;background:none;transform:scale(.8);transition:transform .1s}
/* 左摇杆方块 */
#joy{left:calc(env(safe-area-inset-left) + 14px);bottom:12px;width:var(--joy);height:var(--joy);border-radius:50%;z-index:6}
#joy svg.ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:var(--knob);height:var(--knob);margin:calc(var(--knob) / -2);pointer-events:none;will-change:transform}
.hb{position:fixed;z-index:6;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.05)}
.hb svg{width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 0 2px rgba(0,0,0,.8))}
.hb svg *{stroke:#fff;fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.hb svg text{fill:#fff;stroke:none;font-size:13px;font-weight:700;text-anchor:middle}
.hb.on{background:rgba(127,211,255,.22)}.hb.on svg *{stroke:#9fe0ff}.hb.on svg text{fill:#9fe0ff}
.hb.hot svg *{stroke:#888}.hb.hot svg text{fill:#888}
#fire{right:calc(env(safe-area-inset-right) + 62px);bottom:10px;width:var(--fb);height:var(--fb)}
#fire2{left:calc(env(safe-area-inset-left) + 14px + var(--joy) * .95);bottom:calc(12px + var(--joy) * .95);width:calc(var(--fb) * .85);height:calc(var(--fb) * .85)}
#refuel{right:calc(env(safe-area-inset-right) + 62px + var(--fb) * .1);bottom:calc(18px + var(--fb));width:calc(var(--fb) * .8);height:calc(var(--fb) * .8)}
#alt{right:calc(env(safe-area-inset-right) + 12px);bottom:14px;width:40px;height:min(58vh,230px);z-index:6}
#alt .track{position:absolute;left:50%;top:14px;bottom:14px;width:6px;margin-left:-3px;border-radius:3px;border:1.5px solid rgba(255,255,255,.8);background:rgba(0,0,0,.15);box-shadow:0 0 2px #000}
#alt .mid{position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;background:rgba(255,255,255,.6)}
#alt .lab{position:absolute;left:0;right:0;text-align:center;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
#altThumb{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d8d8d8,#8a8a8a 60%,#555);border:1.5px solid #eee;box-shadow:0 0 5px #000;pointer-events:none;will-change:transform}
#mapOv .cards{display:flex;gap:14px;margin-top:14px}
.card{width:min(27vw,220px);border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.35);background:#111;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.card:active{transform:scale(.96);border-color:#7fd3ff}
.card canvas{display:block;width:100%;height:auto}
.card .nm{padding:7px 4px;font-size:16px;font-weight:800;color:#fff;background:rgba(0,0,0,.6)}
/* 中间仪表条 */
#hud{left:calc(env(safe-area-inset-left) + 26px + var(--joy));right:calc(env(safe-area-inset-right) + 74px + var(--fb));bottom:6px;height:54px;border-radius:10px;background:rgba(8,10,14,.62);border:1px solid rgba(255,210,140,.35);display:flex;align-items:center;justify-content:space-around;padding:0 6px;pointer-events:none;z-index:6}
.cell{display:flex;flex-direction:column;align-items:center;min-width:0;flex:1}
.cell .k{font-size:10px;color:#c8b48a;letter-spacing:1px}
.cell .v{font-size:14px;font-weight:700;color:#f4efe2;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{width:88%;max-width:70px;height:7px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0%;background:#5fe08a;border-radius:4px}
#radar{width:46px;height:46px;flex:0 0 46px}
/* 覆盖层 */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,10,8,.35),rgba(0,0,0,.75));text-align:center}
.title{font-size:min(17vh,86px);font-weight:900;letter-spacing:.08em;color:#050505;font-family:Impact,"Arial Black",sans-serif;-webkit-text-stroke:1.5px #e8e8e8;text-shadow:0 0 10px rgba(255,255,255,.7),0 0 24px rgba(200,220,255,.45)}
.fuelc{flex:1.6}.fuelc .bar{max-width:120px;height:10px}.fuelc .v{color:#ffe08a}
.sub{margin-top:4px;font-size:14px;color:#d8c4a0;letter-spacing:.3em}
.btn{margin-top:22px;padding:12px 46px;font-size:22px;font-weight:800;letter-spacing:.3em;color:#2a0e04;border-radius:30px;border:2px solid #ffe2a0;background:linear-gradient(180deg,#ffe8a8,#e0a040 50%,#b05a18);box-shadow:0 0 20px rgba(255,150,60,.6)}
.btn:active{transform:scale(.95)}
.help{margin-top:16px;font-size:12px;color:#bfb29a;line-height:1.7;max-width:90vw}
.big{font-size:40px;font-weight:900;color:#ff9a5a;text-shadow:0 0 12px #600}
.stat{margin-top:10px;font-size:16px;line-height:1.8}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(200,40,20,.55) 100%)}
#rot{position:fixed;inset:0;z-index:40;background:#0b0b0d;display:none;flex-direction:column;align-items:center;justify-content:center;font-size:18px;color:#ffd27a;text-align:center}
#rot .ph{width:46px;height:80px;border:3px solid #ffd27a;border-radius:9px;margin-bottom:22px;animation:rr 2s infinite}
@keyframes rr{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot.touch{display:flex}}
</style>

<body>
<canvas id="gl"></canvas>
<div id="look"></div>
<div id="vig"></div>
<div id="topL" class="ui hide">得分 <b id="score">0</b><br>击杀 <span id="kills">0</span></div>
<div id="safe" class="ui hide">安全时间 2:00</div>
<div id="msg" class="ui"></div>
<div id="pauseBtn" class="ui hide">❚❚</div>
<div id="cross" class="ui hide"><i class="ring"></i><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="c"></i></div>
<div id="joy" class="ui hide"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(200,200,200,.5)" stroke-width="9"/><circle cx="50" cy="50" r="48.5" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/><circle cx="50" cy="50" r="33" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1"/><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M45 9 L50 4 L55 9"/><path d="M45 91 L50 96 L55 91"/><path d="M9 45 L4 50 L9 55"/><path d="M91 45 L96 50 L91 55"/></g></svg>
<svg id="knob" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="rgba(30,32,36,.85)" stroke="rgba(255,255,255,.7)" stroke-width="2"/><circle cx="50" cy="50" r="33" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/><circle cx="50" cy="50" r="20" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/><circle cx="50" cy="50" r="8" fill="rgba(255,255,255,.25)"/></svg></div>
<div id="fire" class="hb ui hide"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M12 48 H64"/><path d="M12 44 V52"/><path d="M40 35 H68 V41 H40 Z"/><path d="M46 41 V48 M62 41 V48"/><path d="M64 44 H78 V54 H64 Z"/><path d="M78 45 H88 L90 60 H82 L78 54"/><path d="M68 54 L66 64 H72 L73 54"/><path d="M54 48 V57 H59 V48"/><path d="M24 48 L18 64 M30 48 L36 64"/></svg></div><div id="fire2" class="hb ui hide"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M12 48 H64"/><path d="M12 44 V52"/><path d="M40 35 H68 V41 H40 Z"/><path d="M46 41 V48 M62 41 V48"/><path d="M64 44 H78 V54 H64 Z"/><path d="M78 45 H88 L90 60 H82 L78 54"/><path d="M68 54 L66 64 H72 L73 54"/><path d="M54 48 V57 H59 V48"/><path d="M24 48 L18 64 M30 48 L36 64"/></svg></div><div id="refuel" class="hb ui hide"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><rect x="28" y="24" width="28" height="48" rx="3"/><rect x="33" y="30" width="18" height="12"/><path d="M24 72 H60"/><path d="M56 38 H64 Q70 38 70 44 V62 Q70 66 74 66 Q78 66 78 62 V36 L72 30"/></svg></div>
<div id="alt" class="ui hide"><div class="lab" style="top:-2px">▲</div><div class="track"></div><div class="mid"></div><div class="lab" style="bottom:-2px">▼</div><div id="altThumb"></div></div>
<div id="hud" class="ui hide">
  <div class="cell"><span class="k">枪温</span><div class="bar"><i id="heatBar"></i></div><span class="v" id="heatV" style="font-size:11px">0%</span></div>
  <div class="cell"><span class="k">高度</span><span class="v" id="altV">0m</span></div>
  <div class="cell fuelc"><span class="k" style="color:#ffe08a">油量</span><div class="bar"><i id="fuelBar" style="width:100%"></i></div><span class="v" id="fuelV" style="font-size:12px">100%</span></div>
  <div class="cell"><span class="k">空速</span><span class="v" id="spdV">0</span></div>
  <div class="cell"><span class="k">航向</span><span class="v" id="hdgV">000</span></div>
  <div class="cell"><span class="k">机体</span><div class="bar"><i id="hpBar" style="width:100%"></i></div><span class="v" id="hpV" style="font-size:11px">100%</span></div>
  <canvas id="radar" width="92" height="92"></canvas>
</div>
<div id="menu" class="ov"><div class="title">BLACK WING</div><div class="sub">废墟之城 · 猎魔行动</div><div class="btn" id="startBtn" style="letter-spacing:.15em">START</div>
<div class="help">左下摇杆：上推前进 · 左右转向　右下：射击 · 右侧滑杆调高度 · 靠近加油站点加油<br>拖动屏幕空白处：转动视角（不会射击）<br>电脑：WASD/方向键移动 · Q/E 上升/下降 · 空格射击 · 鼠标拖动看</div></div>
<div id="pauseOv" class="ov hide"><div class="big" style="color:#ffd27a">已暂停</div><div class="btn" id="resumeBtn">继续</div><div class="btn" id="quitBtn" style="font-size:16px;padding:8px 30px;margin-top:14px">返回标题</div></div>
<div id="mapOv" class="ov hide"><div class="big" style="color:#fff;font-size:28px">选择战场</div><div class="cards"><div class="card" data-map="city"><canvas width="220" height="130"></canvas><div class="nm">🌐 废墟之城</div></div><div class="card" data-map="desert"><canvas width="220" height="130"></canvas><div class="nm">🌐 荒原之域</div></div><div class="card" data-map="ice"><canvas width="220" height="130"></canvas><div class="nm">🌐 冰封废土</div></div></div><div class="btn" id="mapBack" style="font-size:14px;padding:6px 26px;margin-top:14px">返回</div></div>
<div id="overOv" class="ov hide"><div class="big">机体坠毁</div><div class="stat" id="overStat"></div><div class="btn" id="againBtn">再来一局</div><div class="btn" id="overMap" style="font-size:15px;padding:7px 26px;margin-top:12px">选择地图</div></div>
<div id="rot"><div class="ph"></div>请将手机横过来游玩<br><span style="font-size:13px;color:#aaa;margin-top:8px;display:block">黑翼需要横屏</span></div>

<script type="module">
import * as THREE from 'three';

// ---------- 基础 ----------
const $ = id => document.getElementById(id);
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) $('rot').classList.add('touch');
['contextmenu','gesturestart','gesturechange','gestureend','dblclick','selectstart'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});

let rngSeed = 12345;
const srand = () => { rngSeed = (rngSeed * 16807) % 2147483647; return (rngSeed - 1) / 2147483646; };
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: (window.devicePixelRatio || 1) < 2, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const FOG = 0xb4a08e;
scene.fog = new THREE.Fog(FOG, 220, 1350);
scene.background = new THREE.Color(FOG);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 2600);
camera.rotation.order = 'YXZ';
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xe6ecf5, 0x6a5a4c, 2.4));
const sun = new THREE.DirectionalLight(0xffe0bc, 2.6); sun.position.set(300, 500, 180); scene.add(sun);

function cvTex(w, h, draw, rep) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); }
  return t;
}

// ---------- 天空 ----------
const skyTex = cvTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#6f7f96'); gr.addColorStop(0.35, '#9aa0a8'); gr.addColorStop(0.48, '#d0a88a'); gr.addColorStop(0.52, '#c89a7e'); gr.addColorStop(1, '#5a4a40');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(2000, 24, 16), new THREE.MeshBasicMaterial({map: skyTex, side: THREE.BackSide, fog: false, depthWrite: false}));
sky.renderOrder = -1; scene.add(sky);

const CLEAR_R = 160, WORLD = 960, LAND = 1120, HELI_LIM = 1070;
const STATIONS = [[210, 30], [-240, -210], [470, -460], [-520, 470], [620, 560]];
// ---------- 地面 ----------
const groundTex = cvTex(512, 512, (g, w, h) => {
  g.fillStyle = '#5e5a55'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { const v = 70 + Math.random() * 40 | 0; g.fillStyle = `rgba(${v},${v - 4},${v - 8},.5)`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(25,22,20,.7)'; g.lineWidth = 1.5;
  for (let i = 0; i < 26; i++) { g.beginPath(); let x = Math.random() * w, y = Math.random() * h; g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += rand(-40, 40); y += rand(-40, 40); g.lineTo(x, y); } g.stroke(); }
  g.fillStyle = 'rgba(40,36,32,.6)'; g.fillRect(0, 0, w, 40); g.fillRect(0, 0, 40, h);
  g.fillStyle = 'rgba(220,200,120,.35)'; for (let i = 0; i < w; i += 40) { g.fillRect(i, 18, 20, 3); g.fillRect(18, i, 3, 20); }
}, 30);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(LAND * 2, LAND * 2), new THREE.MeshLambertMaterial({map: groundTex}));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
// 停机坪
const padTex = cvTex(256, 256, (g) => {
  g.fillStyle = '#3c3f44'; g.beginPath(); g.arc(128, 128, 126, 0, 7); g.fill();
  g.strokeStyle = '#e8d070'; g.lineWidth = 8; g.beginPath(); g.arc(128, 128, 110, 0, 7); g.stroke();
  g.fillStyle = '#f0f0f0'; g.font = 'bold 150px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('H', 128, 136);
});
const pad = new THREE.Mesh(new THREE.CircleGeometry(16, 32), new THREE.MeshLambertMaterial({map: padTex}));
pad.rotation.x = -Math.PI / 2; pad.position.y = 0.06; scene.add(pad);

// ---------- 废墟城市 ----------
const winTex = cvTex(128, 256, (g, w, h) => {
  g.fillStyle = '#7d7870'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { const v = 90 + Math.random() * 50 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 12},.35)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  for (let y = 6; y < h - 6; y += 16) for (let x = 6; x < w - 6; x += 15) {
    const r = Math.random();
    g.fillStyle = r < 0.06 ? '#ffb060' : r < 0.55 ? '#23252a' : r < 0.8 ? '#3d4048' : '#141414';
    g.fillRect(x, y, 9, 10);
  }
  g.fillStyle = 'rgba(20,15,10,.35)'; for (let i = 0; i < 8; i++) { g.beginPath(); g.ellipse(Math.random() * w, Math.random() * h, rand(8, 30), rand(10, 40), 0, 0, 7); g.fill(); }
});
const buildings = []; // {x,z,hx,hz,h}
const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
const bMat = new THREE.MeshLambertMaterial({map: winTex});
const bList = [], chunkList = [], girderList = [];
for (let gx = -WORLD + 40; gx <= WORLD - 40; gx += 72) for (let gz = -WORLD + 40; gz <= WORLD - 40; gz += 72) {
  const x = gx + (srand() - .5) * 18, z = gz + (srand() - .5) * 18;
  const d = Math.hypot(x, z);
  if (d < CLEAR_R + 30) continue;
  if (STATIONS.some(st => Math.hypot(st[0] - x, st[1] - z) < 70)) continue;
  if (srand() < 0.28) continue;
  const w = 18 + srand() * 26, dp = 18 + srand() * 26;
  let h = 18 + srand() * 70; if (srand() < 0.16) h = 120 + srand() * 150;
  if (d < 560) { h = 8 + srand() * 30; if (srand() < 0.35) continue; } // 战斗区：低矮废墟，视野开阔
  const broken = srand() < 0.5;
  const tilt = broken && srand() < 0.35 ? (srand() - .5) * 0.18 : 0;
  bList.push({x, z, w, dp, h, tilt, shade: 0.75 + srand() * 0.4});
  buildings.push({x, z, hx: w / 2 + 2, hz: dp / 2 + 2, h: h + 3});

    heli.heat = clamp(heli.heat, 0, 100);
    for (const g of guns) if (firing && !heli.over) g.spin.rotation.z += dt * 40;
    // 刷怪：开局少，缓慢增加
    const maxM = gtime < 40 ? 2 : gtime < SAFE_TIME ? 3 : Math.min(3 + Math.floor((gtime - SAFE_TIME) / 45), 7);
    spawnT -= dt; let alive = 0; for (const m of monsters) if (m.active) alive++;
    if (spawnT <= 0) { spawnT = 7; if (alive < maxM) spawnMonster(false); }
  } else if (state === 'dead') {
    heli.deadT += dt; heli.vy -= 35 * dt; heli.pos.y += heli.vy * dt; look.yaw += dt * 2.5; heli.roll = Math.sin(heli.deadT * 6) * 0.3;
    if (heli.pos.y < 3) { heli.pos.y = 3; heli.vy = 0; }
    if (Math.random() < 0.5) { tmpV.copy(heli.pos); tmpV.y -= 2; emit(tmpV, 3, 1, 0.5, 0.1, 10, 0.8, -5); }
    if (heli.deadT > 2.6) gameOver();
  }
  for (const g of guns) if (g.fT !== undefined) { g.fT -= dt; if (g.fT <= 0) g.flash.visible = false; }
  if (state === 'play' || state === 'dead' || state === 'over') { updateMonsters(dt); updateFireballs(dt); }
  updateTracers(dt); updateParticles(dt);
  // 相机
  if (state === 'menu') {
    menuT += dt * 0.08;
    camera.position.set(Math.sin(menuT) * 260, 70, Math.cos(menuT) * 260);
    camera.rotation.set(-0.05, menuT + 0.3, 0);
    cock.visible = false;
  } else {
    cock.visible = state !== 'over';
    const vib = state === 'play' ? 0.03 + Math.min(0.05, Math.hypot(heli.vel.x, heli.vel.z) / 82 * 0.05) + shakeA : 0; const sk = state === 'play' ? shakeA * 0.05 : 0; shakeA = Math.max(0, shakeA - dt * 4);
    camera.position.set(heli.pos.x + (Math.random() - .5) * vib, heli.pos.y + (Math.random() - .5) * vib, heli.pos.z);
    camera.rotation.set(look.pitch + (Math.random() - .5) * sk, look.yaw + (Math.random() - .5) * sk, heli.roll);
  }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  // 环境动画
  const T = performance.now() / 1000;
  for (const f of fires) { const s = 1 + Math.sin(T * 9 + f.ph) * 0.08 + Math.sin(T * 23 + f.ph) * 0.05; f.s.scale.set(f.base * s, f.base * 1.3 * (2 - s), 1); }
  for (const s of smokes) { s.t += dt * 0.08; if (s.t > 1) s.t -= 1; const sc = s.base * (1 + s.t * 4); s.s.scale.set(sc, sc, 1); s.s.position.set(s.ox + s.t * 25, s.oy + s.t * 90, s.oz); }
  for (let i = 0; i < EMB; i++) {
    const j = i * 3; embPos[j + 1] += embVel[i] * dt; embPos[j] += Math.sin(T + i) * dt * 2;
    if (embPos[j + 1] > 220 || Math.abs(embPos[j] - camera.position.x) > 380 || Math.abs(embPos[j + 2] - camera.position.z) > 380) {
      embPos[j] = camera.position.x + rand(-350, 350); embPos[j + 1] = rand(0, 30); embPos[j + 2] = camera.position.z + rand(-350, 350);
    }
  }
  embGeo.attributes.position.needsUpdate = true;
  waveTex.offset.set(T * 0.004, T * 0.0025); foamMat.opacity = 0.55 + Math.sin(T * 1.6) * 0.3; foamTex.offset.x = T * 0.01;
  if (curMap === 'ice') { for (let i = 0; i < SNOW; i++) { const j = i * 3; snowPos[j + 1] -= dt * (8 + (i % 5)); snowPos[j] += Math.sin(T + i) * dt * 3; if (snowPos[j + 1] < 0 || Math.abs(snowPos[j] - camera.position.x) > 260 || Math.abs(snowPos[j + 2] - camera.position.z) > 260) { snowPos[j] = camera.position.x + rand(-250, 250); snowPos[j + 1] = camera.position.y + rand(40, 120); snowPos[j + 2] = camera.position.z + rand(-250, 250); } } snowGeo.attributes.position.needsUpdate = true; }
  spikeMat.color.setHSL(0.55, 0.9, 0.62 + Math.sin(T * 3) * 0.12);
  stMat.glow.color.setHSL(0.52, 1, 0.55 + Math.sin(T * 3) * 0.1); stMat.beam.opacity = 0.18 + Math.sin(T * 2) * 0.06;
  for (const r of stRings) r.rotation[r.userData.ax] += dt * r.userData.sp;
  // 准星锁定
  if (state === 'play') {
    camera.getWorldDirection(camDir);
    const l = !!rayHit(camera.position, camDir);
    if (l !== lockOn) { lockOn = l; $('cross').classList.toggle('lock', l); }
    updateHUD(false);
  }
  if (vigA > 0) { vigA = Math.max(0, vigA - dt * 1.5); $('vig').style.opacity = vigA.toFixed(2); }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) $('msg').style.opacity = 0; }
}

let last = performance.now(), frames = 0, errCount = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016; dt = Math.min(dt, 0.05); // 限制步长，防止卡顿后跳帧
  try { if (state !== 'paused') update(dt); renderer.render(scene, camera); frames++; }
  catch (e) { if (errCount++ < 5) console.error(e); }
}
requestAnimationFrame(loop);

// 测试接口
window.__heiyi = {
  get state() { return state; }, heli, input, monsters,
  step(n, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  render() { renderer.render(scene, camera); },
  stats() {
    let objs = 0; scene.traverse(() => objs++);
    return {state, gtime: +gtime.toFixed(1), hull: heli.hull, heat: +heli.heat.toFixed(1), score, kills, frames,
      monstersActive: monsters.filter(m => m.active).length, fireballs: fballs.filter(f => f.on).length,
      tracers: tracers.filter(t => t.on).length, particles: pActive, sceneObjects: objs,
      geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, calls: renderer.info.render.calls, ptrs: ptrs.size};
  },
  start: startGame, stations, refuel, startRefuel, get fuel() { return heli.fuel; },
  aimAt(i) { const m = monsters.filter(x => x.alive)[i || 0]; if (!m) return false; const c = m.spheres[0].c; const dx = c.x - heli.pos.x, dy = c.y - heli.pos.y, dz = c.z - heli.pos.z; look.yaw = Math.atan2(-dx, -dz); look.pitch = clamp(Math.atan2(dy, Math.hypot(dx, dz)), -1.1, 0.6); return true; },
};
</script>
